name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        mode: [release, sanitizers]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.mode == 'sanitizers' && 'Debug' || 'Release' }}
          -DECL_WARNINGS_AS_ERRORS=ON
          -DECL_SANITIZE=${{ matrix.mode == 'sanitizers' && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Run the examples
        run: |
          ./build/examples/host/sensor_pipeline
          ./build/examples/host/vibration_demo

  static-analysis:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy

      - name: Run clang-tidy
        run: >
          clang-tidy
          tests/header_check.cpp
          examples/host/01_sensor_pipeline.cpp
          examples/host/02_vibration_demo.cpp
          -- -std=c++17 -Iinclude -Iexamples/common
